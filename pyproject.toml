[project]
name = "daily-orders-api-to-warehouse"
version = "0.1.0"
description = "A learning project: a daily batch pipeline from an order API to a warehouse."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "ipykernel>=7.0.0",
    "nbclient>=0.10.0",
    "nbformat>=5.10.0",
    "pandas>=2.3.0",
    "tzdata>=2025.2",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

# The fake order system is installed into the virtual environment,
# so every milestone can reach it as `order_system`.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["order_system"]

[tool.ruff]
line-length = 100
src = ["src/*", "src/*/tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "E402"]

# Tests are run per folder: `uv run pytest` inside order_system/ or inside src/<milestone>/.
